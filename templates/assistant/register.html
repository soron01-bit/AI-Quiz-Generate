{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="card mx-auto mt-4" style="max-width: 450px;">
    <h2 class="text-center text-gradient mb-4">Create Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn-primary-custom w-100 mt-3">Sign Up</button>
    </form>
    <div class="text-center mt-3" style="color:var(--text-secondary); font-size:0.9rem;">
        Already have an account? <a href="{% url 'login' %}" style="color:var(--primary-color);">Login Here</a>
    </div>
</div>
{% endblock %}
